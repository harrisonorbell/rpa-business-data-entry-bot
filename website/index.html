<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coastal Orders Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Coastal Orders Manager</h1>
            <p>Internal Order Management System</p>
        </header>

        <section class="card">
            <h2>Create New Order</h2>

            <form id="orderForm">

                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" required>
                </div>

                <div class="form-group">
                    <label for="customerEmail">Customer Email</label>
                    <input type="email" id="customerEmail" required>
                </div>

                <div class="form-group">
                    <label for="product">Product</label>
                    <input type="text" id="product" required>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" min="1" required>
                </div>

                <div class="form-group">
                    <label for="unitPrice">Unit Price ($)</label>
                    <input type="number" id="unitPrice" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="deliveryAddress">Delivery Address</label>
                    <textarea id="deliveryAddress" rows="3" required></textarea>
                </div>

                <button type="submit" id="submitOrder">
                    Save Order
                </button>

            </form>

            <div id="message" class="message"></div>
        </section>

        <section class="card">
            <h2>Recent Orders</h2>

            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="ordersTable">
                    <tr>
                        <td colspan="6" class="empty">
                            No orders have been submitted yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>

</body>
</html>
